[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "npcc"
version = "0.1.0"
description = "Neural Pair-Copulas Constructions (NPCCs) for multivariate conditional density estimation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyvinecopulib>=1.0.0",
  "tabpfn>=8.0",
  "torch>=2.5",
]

[project.optional-dependencies]
cpu = ["torch>=2.5"]
cu126 = ["torch>=2.5"]
cu128 = ["torch>=2.5"]
cu130 = ["torch>=2.5"]
cu132 = ["torch>=2.5"]
# Simulation-study package (npcc.experiments) and the npcc-simstudy CLI.
experiments = ["pandas>=2.0", "matplotlib>=3.7", "pyarrow>=15.0,<24.0"]
# Optional non-TabPFN inner backends (mirrors ScoringBench's
# requirements_models.txt).  Each is selected via
# RosenblattBicop(backend=...).
gbm = ["scikit-learn>=1.3"]
ngboost = ["ngboost>=0.5.0"]
tabicl = ["tabicl>=2.0"]
catboost = ["catboost>=1.2"]
xgboost = ["xgboost>=2.0"]
pytabkit = ["pytabkit>=1.5"]
# Synthefy Nori. Pinned to the tvatter fork (see [tool.uv.sources]) until the
# torch-uncapping fix lands on upstream PyPI; then this becomes a plain pin.
nori = ["synthefy-nori>=0.12"]
# Umbrella of every non-TabPFN backend, installable alongside a CUDA flavor,
# e.g. `uv sync --extra cu130 --extra backends`.
backends = [
  "scikit-learn>=1.3",
  "ngboost>=0.5.0",
  "tabicl>=2.0",
  "catboost>=1.2",
  "xgboost>=2.0",
  "pytabkit>=1.5",
  "synthefy-nori>=0.12",
]

[project.scripts]
npcc-simstudy = "npcc.experiments.cli:main"

[dependency-groups]
dev = [
  # Linters and formatters
  "ruff>=0.9",
  # 0.0.73 is where the off-by-default rules in [tool.ty.rules] exist; an
  # older one warns `unknown-rule` and silently checks less.
  "ty>=0.0.73",
  # Unit testing
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-xdist>=3.0.0",
  # For loading TABPFN_TOKEN from .env in the integration test
  "python-dotenv>=1.0",
  # Prose and docstring checks, run by `make lint` and pre-commit
  "codespell>=2.3",
  "numpydoc>=1.8",
  "pre-commit>=4.0",
  # Executes the notebooks under pytest, so a stale demo fails somewhere
  "nbmake>=1.5",
]
interactive = [
  # For data wrangling
  "pandas>=2.0",
  # For notebooks
  "marimo>=0.10",
  "notebook>=7.0.0",
  "ipykernel>=6.25.0",
  "ipywidgets>=8.1.0",
  # Visualization
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "plotnine",
  # Tables
  "great-tables>=0.18.0",
  "tabulate>=0.9.0",
]

[tool.uv]
default-groups = ["dev", "interactive"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu128" },
    { extra = "cu130" },
    { extra = "cu132" },
  ],
]

[tool.uv.sources]
# pyvinecopulib 1.0.0 is not on PyPI yet (0.7.6 is the newest release, and
# there is no v1.0.0 tag), so the 1.0 extension-point API this package builds
# on is only reachable from git.
#
# Pinned *ahead* of `main` to vinecopulib/pyvinecopulib#339, which moves
# `var_types` onto `BicopBase` and observation weights into the controls.
# What that buys here: `pdf`, `cdf`, `hfunc1/2`
# and `hinv1/2` become dispatchers on the base, so `core/bicop.py` writes the
# continuous leaves `_pdf_raw` / `_cdf_raw` / `_hfunc1_raw` / `_hfunc2_raw` /
# `_hinv1_raw` / `_hinv2_raw` and overrides no public member; `with_var_types`
# is the door a discrete declaration arrives through, which the same file
# refuses; and `_prep_args` is the documented override point for a subclass
# whose domain step differs from the library's, which is what keeps
# `core/_trim.py`'s `check_uv` and its `eps` clamp rather than upstream's
# silent one at the working precision.
#
# The stack below it is #336 (submodule bumps, `logpdf`, the exact atom
# probability) and #337 (the lockfile). Both are open, so this pin carries all
# three.
#
# Pinned at the head of that branch rather than at a commit inside it, so the
# pin tracks what will merge. Two steps out of here, in order: move to the
# merge commit once the stack lands, then drop the override entirely once a
# published 1.0.0 carries these -- at which point `.github/workflows/ci.yml`
# stops needing a C++ toolchain too.
pyvinecopulib = { git = "https://github.com/vinecopulib/pyvinecopulib.git", rev = "93d056368980dc686d14ab9d16b960742a3f9547" }
# Temporary: install Synthefy Nori from the fork branch that uncaps torch
# (PR https://github.com/Synthefy/synthefy-nori/pull/79). Drop once on PyPI.
synthefy-nori = { git = "https://github.com/tvatter/synthefy-nori.git", branch = "allow-newer-torch-cuda" }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu130", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 80
target-version = "py311"
indent-width = 2
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# These sets complement `ty` rather than restating conventions AGENTS.md
# already states, which is why `ALL` is not used. `preview` lets `PYI` read
# `.py` files as well as stubs.
extend-select = [
  "ANN",
  "ERA001",
  "I",
  "PGH003",
  "PYI",
  "RUF022",
  "RUF045",
  "RUF100",
  "TC",
]
preview = true
# Annotations here are read at runtime -- the numpydoc hook imports modules,
# and the fit-controls dataclasses resolve their own field types -- so moving
# an import behind `TYPE_CHECKING` makes the signature that uses it
# unresolvable. `TC006` stays.
ignore = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
# Marimo cell functions have a reactive-graph signature style that makes
# ANN annotations on cell arguments extremely verbose and unidiomatic.
"notebooks/**" = ["ANN"]
# A test passes a wrong type on purpose to prove a runtime guard fires.
"tests/**" = ["ANN401"]

# Type checking with ty
[tool.ty.environment]
python = ".venv"
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
unresolved-import = "error"
# Off by default in ty. Each costs nothing on this tree, and each covers a
# class of fault the linter cannot see.
blanket-ignore-comment = "error"
division-by-zero = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"

[tool.ty.analysis]
# `# ty: ignore[rule]` required instead of a blanket `# type: ignore`.
respect-type-ignore-comments = false
# The optional inner backends. Each is behind an extra, so a checkout synced
# with only `--extra cpu` must still type-check -- which is what CI does.
allowed-unresolved-imports = [
  "catboost",
  "ngboost",
  "ngboost.distns",
  "ngboost.learners",
  "pytabkit",
  "sklearn",
  "sklearn.ensemble",
  "synthefy_nori",
  "tabicl",
  "xgboost",
]
# The same optional backends, for the case where they *are* installed: none
# ships type information, so their members resolve to nothing and every
# attribute read is a `possibly-missing-attribute`. Reading them as `Any` is
# the accurate description -- the adapter that wraps each one is where the shape
# is checked, at run time, by its tests.
replace-imports-with-any = [
  "catboost",
  "ngboost",
  "ngboost.distns",
  "ngboost.learners",
  "pytabkit",
  "synthefy_nori",
  "tabicl",
  "xgboost",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# `-n auto` is passed on the command line rather than set here, so a single
# test can be run without spinning up workers.
#
# `-m "not cuda"` is the default because most machines have no GPU and the
# suite has to pass on them: CI is CPU-only, and four xdist workers each
# opening a CUDA context is not something to do by accident. A command-line
# `-m cuda` is appended after these and wins, which is what `make test-cuda`
# passes.
addopts = ["--strict-markers", "--strict-config", "-m", "not cuda"]
markers = [
  "cuda: needs a CUDA device; skipped when torch.cuda.is_available() is False",
  "real_model: downloads or calls a real third-party model; needs credentials",
]

[tool.numpydoc_validation]
# Run by pre-commit; ad-hoc with `uv run numpydoc lint src/npcc`.
# GL01 is off: it contradicts numpydoc's own format-spec example, so both
# same-line and newline-first summaries are allowed. SS01/SS02 still require
# a capitalized summary.
checks = ["GL02", "GL03", "GL05", "GL07", "PR02", "PR03", "RT04", "SS01", "SS02"]
exclude = [
  # Private methods (single-underscore prefix, not dunder) inside the public
  # modules: off-contract per the underscore-prefix rule.
  '\._[a-z][a-zA-Z0-9_]*$',
]

[tool.codespell]
# `en-GB_to_en-US` enforces the American-English rule from AGENTS.md.
builtin = "clear,rare,en-GB_to_en-US"
# The banned-word list. Each entry carries a reason after a comma, which is
# what makes codespell report a suggestion instead of auto-fixing: the right
# replacement depends on the sentence. The file must come first -- a value
# beginning with `-` is read as another flag.
dictionary = ".codespell-prose.txt,-"
# A banned word is sometimes the right word. To use one, wrap the lines in
# `# codespell:ignore-begin` / `-end`.
ignore-multiline-regex = "codespell:ignore-begin *\\n.*?codespell:ignore-end *\\n"
skip = ".claude/*,*/htmlcov/*,*/results/*,*/catboost_info/*,*/uv.lock,*/.venv/*,*.codespell-prose.txt,*test_prose.py"
# Domain vocabulary and author names read as misspellings. `aas` is Kjersti
# Aas; `nd` and `iff` are mathematical.
ignore-words-list = "aas,nd,iff,ans,te,strat"
# Base64 payloads in notebook outputs are not prose.
ignore-regex = "[A-Za-z0-9+/]{32,}={0,2}"
