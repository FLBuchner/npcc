name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guards `test`, so a formatting error does not cost a full CPU-wheel
  # install and a model download.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra cpu --extra experiments --extra backends
      - run: make check

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra cpu --extra experiments --extra backends
      # The suite is hermetic: TabPFN is faked, and the tests that reach a real
      # model skip when their dependency or credentials are absent.
      - run: uv run --no-sync pytest tests/ -q -n auto
