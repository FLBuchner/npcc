# Example grid for the npcc conditional-copula simulation study.
# Run with:
#   npcc-simstudy --config configs/study.toml --out results/ --workers 1
#   npcc-simstudy --config configs/study.toml --out results/ --workers 1 --resume
#
# The study sweeps the cartesian product of the data axes (family, tau_scenario,
# n, rep). Each cell samples its own data + ground truth once; every estimator
# in `[[grid.estimators]]` is fitted on that shared data. Each cell's rows are
# checkpointed under `results/cells/`, so `--resume` continues an interrupted
# run. Metrics are aggregated over a uv grid at each fixed x, diagnostics check
# margins and dependence, and plot-ready quantities are written only for the
# families listed in `surface_families`.
#
# Metrics scored: pdf + hfunc1 + hfunc2 only (what matters for density
# estimation and vines). The joint-CDF metric was dropped — its trapezoidal
# integration over inner conditional-CDF forwards dominated runtime for the
# foundation models without informing the density/vine question.
#
# WALL TIME IS UNMEASURED FOR THIS GRID. The only measurement taken was on an
# RTX 2080 Ti, workers=1, over a *smaller* grid than the one below: n_rep = 5,
# n = [200,500,1000], 10 backends, giving ~2.06 h per seed and ~10.3 h total.
# The grid below is larger on three axes at once -- n_rep = 10, n gains 2000
# (the slowest point), and 18 estimators rather than 10 -- so that number is
# not a budget for it. As configured this is 160 cells and 5760 fits (each
# cell fits every estimator in both Rosenblatt directions).
#
# Time one cell on the target machine before committing to the full run:
#   npcc-simstudy --config configs/study.toml --out /tmp/probe --workers 1
# with `families`, `tau_scenarios` and `n` each cut to one entry and
# `n_rep = 1`. Multiply by 160 and by the n-cost ratio.
#
# Backends intentionally EXCLUDED from this run (too slow for the full grid):
#   - catboost   (~74 s/fit; ~1.5 h of grid) and gbm (101 sklearn models/dir) —
#     redundant slow GBM-quantile variants; xgb-quantile is the representative.
#   - tabpfn-finetune / tabicl-finetune — GPU training loops (minutes x 2
#     directions x 72 fits = many hours); run those in a separate small study.

# CONCURRENCY. `--workers` runs whole data cells in a *thread* pool, so it
# overlaps well where the work releases the GIL (the TabPFN and other torch
# backends) and poorly where it does not (the sklearn-style CPU backends:
# ngboost, xgboost, pytabkit). All workers share one CUDA context and one
# device, so on a single accelerator raise `--workers` for occupancy rather
# than expecting linear scaling, and watch memory: each concurrent cell holds
# its own fitted backends.
#
# NOTE ON `normalize`. Adding entries is close to free: the study evaluates
# the whole axis in one `pdf_by_projection` call, and the two inner-backend
# passes a projection needs -- the density at the points, and the density on
# the projection grid per unique covariate row -- do not depend on the
# iteration count, so they are paid for once. Only the Sinkhorn iteration and
# its interpolation repeat, and neither reaches a backend. A "none" entry adds
# nothing at all: the projection grid is built lazily.

[grid]
# Copula families (one-parameter): clayton, gumbel, frank, gaussian, joe.
families = ["clayton", "gaussian"]

# Conditional tau(x) regimes: monotone, symmetric, and nonmonotone.
tau_scenarios = ["linear", "sin"]

# Sinkhorn normalization variants applied to the density. "none" = off.
# Kept at "none" only: the projection degenerates (±inf KL) for the sharper
# tree/parametric densities — hardening it is a separate follow-up.
normalize = ["none"]

# Training sample sizes and Monte-Carlo repetitions. n_rep = 5 seeds fits an
# overnight window (~2.06 h/seed measured; ~10.3 h total).
n = [200, 500, 1000, 2000]
n_rep = 10

# Grid resolution for the (disabled) Sinkhorn projection; unused with
# normalize = ["none"].
projection_grid_size = 30

# Inner-backend inference chunk. Omitted = the device-aware default, 2000 on
# CUDA and 400 on CPU, which is sized for an 8 GB laptop card. On a large
# accelerator a bigger chunk cuts the number of forward passes; it is the
# first knob to tune there. It changes throughput and not results, so it is
# absent from the `--resume` signature and re-tuning it keeps every cell
# already computed.
# batch_size = 8192

# Conditional metric grid: 20x20 uv points and 10 x slices.
conditional_uv_grid_n = 20
conditional_x_grid_n = 10

# Plot-ready quantities are written only for these Kendall-tau slices and
# families.
surface_tau_levels = [0.1, 0.5, 0.9]
surface_families = ["clayton"]

# Kendall's tau diagnostics are sample-based and comparatively expensive.
enable_tau_diagnostics = true
tau_diagnostic_n = 1000

# Estimators: each is a registry backend + support transform + optional
# per-estimator `backend_kwargs` (see `npcc.available_backends()`). TabPFN model
# version (v2.5 / v3) is a hyperparameter, not a distinct backend. Non-TabPFN
# backends need their optional extra installed (`uv sync --extra cu130 --extra
# backends`; Nori via the fork, see pyproject.toml).

[[grid.estimators]]
label = "tabpfn-criterion-v2.5-logit"
backend = "tabpfn-criterion"
transform = "logit"
backend_kwargs = { model_version = "v2.5" }

[[grid.estimators]]
label = "tabpfn-criterion-v2.5-probit"
backend = "tabpfn-criterion"
transform = "probit"
backend_kwargs = { model_version = "v2.5" }

[[grid.estimators]]
label = "tabpfn-criterion-v3-logit"
backend = "tabpfn-criterion"
transform = "logit"
backend_kwargs = { model_version = "v3" }

[[grid.estimators]]
label = "tabpfn-criterion-v3-probit"
backend = "tabpfn-criterion"
transform = "probit"
backend_kwargs = { model_version = "v3" }

[[grid.estimators]]
label = "tabpfn-quantiles-v2.5-logit"
backend = "tabpfn-quantiles"
transform = "logit"
backend_kwargs = { model_version = "v2.5" }

[[grid.estimators]]
label = "tabpfn-quantiles-v2.5-probit"
backend = "tabpfn-quantiles"
transform = "probit"
backend_kwargs = { model_version = "v2.5" }

[[grid.estimators]]
label = "tabpfn-quantiles-v3-logit"
backend = "tabpfn-quantiles"
transform = "logit"
backend_kwargs = { model_version = "v3" }

[[grid.estimators]]
label = "tabpfn-quantiles-v3-probit"
backend = "tabpfn-quantiles"
transform = "probit"
backend_kwargs = { model_version = "v3" }

[[grid.estimators]]
label = "nori-logit"
backend = "nori"
transform = "logit"

[[grid.estimators]]
label = "nori-probit"
backend = "nori"
transform = "probit"

[[grid.estimators]]
label = "tabicl-logit"
backend = "tabicl"
transform = "logit"

[[grid.estimators]]
label = "tabicl-probit"
backend = "tabicl"
transform = "probit"

[[grid.estimators]]
label = "ngboost-logit"
backend = "ngboost"
transform = "logit"

[[grid.estimators]]
label = "ngboost-probit"
backend = "ngboost"
transform = "probit"

[[grid.estimators]]
label = "pytabkit-realmlp-logit"
backend = "pytabkit-realmlp"
transform = "logit"

[[grid.estimators]]
label = "pytabkit-realmlp-probit"
backend = "pytabkit-realmlp"
transform = "probit"

[[grid.estimators]]
