# E2d, E2 at n = 2000, d = 3 and 5 (scripts/paper/README.md, E2):
# `npcc-vinestudy --config configs/vine_study_n2000.toml --out results/vine_n2000_<TAG>`.
#
# configs/vine_study.toml at n = [2000], with all four arms in one run:
# oracle, random, selected (configs/vine_study_selected.toml's arm) and
# kde-tll. Every other key is E2's. A cell's truth, test points and random
# structure are drawn from (d, rep) alone, so each pairs with E2's cells at
# n = 500 and 1000 by (d, rep); only the training sample is drawn anew, from
# (d, n, rep). configs/vine_study_d10_n2000.toml is the same at d = 10.

[grid]
dims = [3, 5]
n = [2000]
n_rep = 20
arms = ["oracle", "random", "selected", "tll"]

eval_x_n = 5
eval_m = 1000

projection_grid_size = 30

[[grid.estimators]]
label = "tabpfn-quantiles-v3-probit"
backend = "tabpfn-quantiles"
transform = "probit"
backend_kwargs = { model_version = "v3", model_kwargs = { softmax_temperature = 1.0 } }
