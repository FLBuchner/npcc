# The weather application, consolidated for the paper's rerun of section 4:
# our measured triple (configs/application_triple.toml) and FLBuchner's
# five-variable design and seven margins (npcc-paper PR #6) in one run.
#
# - Margins: seven models, each fitted once to all five responses, with
#   out-of-fold training PITs (leave one training year out) for the copulas,
#   and their test quantiles stored as float32.
# - The main design, the triple (d = 3): copulas on (T, RH, p), the dew point
#   and the mixing ratio derived from every draw, so every draw is physically
#   possible by construction. Its log score is joint_nll_modeled.
# - The 5d design (arms named <arm>@5d): copulas on all five responses at
#   once, as PR #6 fits them. Two of the five are functions of the other
#   three in the data, so their joint distribution has no density: the 5d
#   log score (joint_nll_5d) stays in the files but is not ranked. The 5d
#   arms are compared with the triple's on the scores both draw: energy and
#   variogram on all five responses, each response's sample CRPS, and the
#   share of draws breaking a physical bound. That is how much accuracy a
#   physically possible model gives up.
#
#   npcc-application margins  --config configs/application_consolidated.toml --out results/application_consolidated
#   npcc-application copulas  --config configs/application_consolidated.toml --out results/application_consolidated
#   npcc-application evaluate --config configs/application_consolidated.toml --out results/application_consolidated
#   python scripts/paper/application/paired_summary.py --run results/application_consolidated
#
# The summaries, fixed before the run (paired_summary.py, every score
# lower-is-better, paired by station, on every station and without station
# 106):
#   (i)   every arm's pooled mean of every score;
#   (ii)  every arm against gaussian on the same margins and design
#         (gaussian@5d for a 5d arm), and every arm against the anchor,
#         npcc-mixture-tabpfn-quantiles-all on tabpfn-quantiles-all;
#   (iii) the 5d arms against the same arm of the triple on the same margins:
#         independence and gaussian on emos-seasonal and tabpfn-quantiles-all,
#         and npcc-chain-tabpfn-quantiles-all on tabpfn-quantiles-all, on
#         energy, variogram, each response's sample CRPS and the share of
#         draws breaking each physical bound (Td > T, RH outside [0, 100],
#         w < 0, p <= e).

base_seed = 317

[data]
dir = "~/npcc-data/meteoswiss_zanetta2023"
verify = true
stations = "all"
lead_hours = 24
init_hour = 0
train = [2017-01-01, 2020-12-31]
test = [2021-01-01, 2021-12-31]
min_cases = 20

[margins]
# Seasonal EMOS, against which the CRPSS is read, and each npcc backend on
# all the covariates or on seasonal EMOS's (the target's ensemble mean and
# the day of year), as PR #6 and configs/application.toml have them.
models = [
  "emos-seasonal",
  "lightgbm-all",
  "lightgbm-emos",
  "tabpfn-quantiles-all",
  "tabpfn-quantiles-emos",
  "tabicl-all",
  "tabicl-emos",
]
n_levels = 199
# The copulas' training PITs come from margins fitted without the case's
# initialization year, leave one year out over the four training years. A
# margin evaluated at its own training cases crowds their PITs toward 0.5:
# in the triple's full run (dc09eaf), TabPFN's in-sample training PITs had
# SD 0.26 to 0.27 against a uniform 0.289. The test predictions stay those of
# the margin fitted on every training case; evaluate's
# tables/margins_pit_uniformity.csv compares both kinds of training PIT.
train_pits = "out_of_fold"
# Rounded to float32 as soon as they are predicted, then scored and stored:
# 7 significant digits, ample for data on a 0.1 grid, and half the disk. The
# copula stage reads the stored values, so a rerun from the files reproduces
# every score.
quantile_dtype = "float32"

# The main design: the measured triple. T, RH and p are measured, stored
# exactly on a 0.1 grid; the dew point and the mixing ratio are computed from
# them (npcc.experiments.application.derived), so the triple's arms derive
# them from every draw. The 5d design below also fits a copula to them, so
# their margins are fitted too. RH keeps FLBuchner's logit transform,
# 100 -> 99.95 boundary nudge and beta EMOS.
[responses]
modeled = ["obs:air_temperature", "obs:relative_humidity", "obs:surface_air_pressure"]
derived = ["obs:dew_point_temperature", "obs:water_vapor_mixing_ratio"]
# MeteoSwiss's piecewise Magnus formula, as Zanetta et al. (2023) use it, the
# coefficient set chosen by the air temperature's sign for both vapor
# pressures, which reproduces the stored dew point to float32 precision.
magnus = "meteoswiss"
"obs:air_temperature" = { transform = "identity" }
"obs:dew_point_temperature" = { transform = "identity" }
"obs:relative_humidity" = { transform = "logit", scale = 100.0, boundary_nudge = 0.05 }
"obs:surface_air_pressure" = { transform = "identity" }
"obs:water_vapor_mixing_ratio" = { transform = "log" }

# The arms, per margins and design:
# - the triple, every margin: independence, gaussian, boostcopula-all;
# - the triple, the six npcc margins: the chain rule on TabPFN with all
#   covariates. It stays off the EMOS margins: fitted to PITs that are not
#   uniform given the covariates, as EMOS's are, a covariate-dependent copula
#   partly recalibrates the margins, and which response keeps its margin then
#   depends on the order it is drawn in (section 4; checks/ in
#   results/application_triple_smoke_2026-11-12);
# - the triple, tabpfn-quantiles-all, the main table: boostcopula-time, the
#   npcc mixtures on all covariates and on the day of year (every structure
#   at d = 3, each member also scored), and the chain on the day of year;
# - 5d, emos-seasonal and tabpfn-quantiles-all: independence, gaussian;
# - 5d, tabpfn-quantiles-all: the chain rule on TabPFN with all covariates.
# An arm and its 5d counterpart share their seeds, so their comparison sees
# the same random numbers.
[copulas]
arms = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "boostcopula-time",
  "npcc-mixture-tabpfn-quantiles-all",
  "npcc-mixture-tabpfn-quantiles-time",
  "npcc-chain-tabpfn-quantiles-all",
  "npcc-chain-tabpfn-quantiles-time",
  "independence@5d",
  "gaussian@5d",
  "npcc-chain-tabpfn-quantiles-all@5d",
]
n_draws = 200
# 20000 rows per sampling call, as in the triple's full run.
sample_batch_size = 20000
# A mixture's members, at most the 3 structures there are at d = 3; and the
# chain's number of distinct variable orders, 5 of 3! = 6 at d = 3 and of
# 5! = 120 at d = 5.
mixture_k = 5
# Each arm's draws of all five responses, per test case, are stored beside
# its scores as draws.parquet (float32, zstd), about 1.45 MB per arm and
# station at 200 draws before compression; a mixture's members are scored on
# their own draws, which are not stored. Every score is computed from all
# 200 draws before anything is stored, so the paper's numbers do not depend
# on what is stored. All 200 are stored for every arm on
# tabpfn-quantiles-all, the main table, and for every 5d arm; on the six
# other margins, the triple's arms (independence, gaussian, boostcopula-all,
# and the chain on all covariates) store each case's first 50, so the run's
# draws take about 3.6 GB rather than 6.8 GB before compression.
# scripts/paper/application/thin_draws.py keeps fewer, in place, if the disk
# still fills.
save_draws = true
stored_draws_by_margin = { "emos-seasonal" = 50, "lightgbm-all" = 50, "lightgbm-emos" = 50, "tabpfn-quantiles-emos" = 50, "tabicl-all" = 50, "tabicl-emos" = 50 }

[copulas.arms_by_margin]
"emos-seasonal" = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "independence@5d",
  "gaussian@5d",
]
"lightgbm-all" = ["independence", "gaussian", "boostcopula-all", "npcc-chain-tabpfn-quantiles-all"]
"lightgbm-emos" = ["independence", "gaussian", "boostcopula-all", "npcc-chain-tabpfn-quantiles-all"]
"tabpfn-quantiles-all" = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "boostcopula-time",
  "npcc-mixture-tabpfn-quantiles-all",
  "npcc-mixture-tabpfn-quantiles-time",
  "npcc-chain-tabpfn-quantiles-all",
  "npcc-chain-tabpfn-quantiles-time",
  "independence@5d",
  "gaussian@5d",
  "npcc-chain-tabpfn-quantiles-all@5d",
]
"tabpfn-quantiles-emos" = ["independence", "gaussian", "boostcopula-all", "npcc-chain-tabpfn-quantiles-all"]
"tabicl-all" = ["independence", "gaussian", "boostcopula-all", "npcc-chain-tabpfn-quantiles-all"]
"tabicl-emos" = ["independence", "gaussian", "boostcopula-all", "npcc-chain-tabpfn-quantiles-all"]

# The 5d design: every response modeled, none derived.
[copulas.designs.5d]
modeled = [
  "obs:air_temperature",
  "obs:dew_point_temperature",
  "obs:relative_humidity",
  "obs:surface_air_pressure",
  "obs:water_vapor_mixing_ratio",
]
derived = []

# `--device` overrides every entry. A backend left out picks its own: CUDA
# where there is one.
[devices]
lightgbm = "cpu"
tabpfn-quantiles = "cuda"
tabicl = "cuda"

# E1's entries, copied verbatim from configs/study.toml, so a label means the
# same backend configuration in both; tests/experiments/
# test_application_config.py pins their estimator_id to E1's. A margin uses
# an entry's backend and backend_kwargs on its response's transform; a copula
# uses the entry whole.

[[estimators]]
label = "tabpfn-quantiles-v3-probit"
backend = "tabpfn-quantiles"
transform = "probit"
backend_kwargs = { model_version = "v3", model_kwargs = { softmax_temperature = 1.0 } }

[[estimators]]
label = "tabicl-probit"
backend = "tabicl"
transform = "probit"

[[estimators]]
label = "lightgbm-probit"
backend = "lightgbm"
transform = "probit"
