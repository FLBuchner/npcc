# The weather application on the measured triple (T, RH, p): margins and
# copulas (d = 3) are fitted to temperature, relative humidity and pressure,
# and the dew point and the mixing ratio are derived from every draw. In the
# data both are functions of the triple (scripts/paper/application/README.md),
# so the five responses have no joint density and a five-variable log score
# is not defined; this design scores the triple's log score and every
# response's energy, variogram and sample CRPS.
#   npcc-application margins  --config configs/application_triple.toml --out results/application_triple
#   npcc-application copulas  --config configs/application_triple.toml --out results/application_triple
#   npcc-application evaluate --config configs/application_triple.toml --out results/application_triple
# configs/application.toml, the five-response design, stays the default.

base_seed = 317

[data]
dir = "~/npcc-data/meteoswiss_zanetta2023"
verify = true
stations = "all"
lead_hours = 24
init_hour = 0
train = [2017-01-01, 2020-12-31]
test = [2021-01-01, 2021-12-31]
min_cases = 20

[margins]
# The seasonal EMOS baseline, against which the CRPSS is read, and TabPFN on
# all the covariates.
models = ["emos-seasonal", "tabpfn-quantiles-all"]
n_levels = 199

# The measured triple. T, RH and p are measured, stored exactly on a 0.1
# grid; the dew point and the mixing ratio are computed from them
# (npcc.experiments.application.derived), so they are derived from every
# copula draw of (T, RH, p) and scored with it, but no margin or copula is
# fitted to them and their scales below are unused. RH keeps FLBuchner's
# logit transform, 100 -> 99.95 boundary nudge and beta EMOS.
[responses]
modeled = ["obs:air_temperature", "obs:relative_humidity", "obs:surface_air_pressure"]
derived = ["obs:dew_point_temperature", "obs:water_vapor_mixing_ratio"]
# MeteoSwiss's piecewise Magnus formula, as Zanetta et al. (2023) use.
magnus = "meteoswiss"
"obs:air_temperature" = { transform = "identity" }
"obs:dew_point_temperature" = { transform = "identity" }
"obs:relative_humidity" = { transform = "logit", scale = 100.0, boundary_nudge = 0.05 }
"obs:surface_air_pressure" = { transform = "identity" }
"obs:water_vapor_mixing_ratio" = { transform = "log" }

# The npcc copulas run on the TabPFN margins alone. They condition on the
# covariates, and on PITs that are not uniform given them, as EMOS's are, a
# covariate-dependent pair copula partly recalibrates the margins: its density,
# the average of its two Rosenblatt directions, then differs from what its
# one-directional inverse-Rosenblatt simulation draws, and which response
# keeps its margin depends on the vine's order (checks/ in the station-0 smoke
# run, results/application_triple_smoke_2026-11-12). The EMOS margins carry
# the classical arms, so EMOS with a Gaussian copula is the reference
# pipeline. At d = 3 every structure is a member of the mixture, so the random
# arm, one of them, is left out.
[copulas]
margins = ["emos-seasonal", "tabpfn-quantiles-all"]
arms = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "boostcopula-time",
  "npcc-mixture-tabpfn-quantiles-all",
  "npcc-mixture-tabpfn-quantiles-time",
]
arms_by_margin = { "emos-seasonal" = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "boostcopula-time",
] }
n_draws = 200
# 20000 rows per sampling call: on station 0's npcc-random arm, the copula
# prediction took 36.3 s, against 39.6 s at the smoke run's 5000 and 73.5 s
# at 80000 (every draw at once); the log densities are the same bit for bit,
# the draws another Monte Carlo sample.
sample_batch_size = 20000
mixture_k = 5

# `--device` overrides every entry. A backend left out picks its own: CUDA
# where there is one.
[devices]
lightgbm = "cpu"
tabpfn-quantiles = "cuda"
tabicl = "cuda"

# E1's entries, copied verbatim from configs/study.toml, so a label means the
# same backend configuration in both; tests/experiments/
# test_application_config.py pins their estimator_id to E1's. A margin uses
# an entry's backend and backend_kwargs on its response's transform; a copula
# uses the entry whole.

[[estimators]]
label = "tabpfn-quantiles-v3-probit"
backend = "tabpfn-quantiles"
transform = "probit"
backend_kwargs = { model_version = "v3", model_kwargs = { softmax_temperature = 1.0 } }

[[estimators]]
label = "tabicl-probit"
backend = "tabicl"
transform = "probit"

[[estimators]]
label = "lightgbm-probit"
backend = "lightgbm"
transform = "probit"
