# The station-0 smoke run of the triple, as run into
# results/application_triple_smoke_2026-11-12: every arm on both margins, so
# every arm's cost on the triple was seen once before the full run. The full
# run, configs/application_triple.toml, keeps its data, margins and settings
# but runs the npcc arms on the TabPFN margins alone and drops the random arm.
#   npcc-application margins  --config configs/application_smoke_triple.toml --out <folder>
#   npcc-application copulas  --config configs/application_smoke_triple.toml --out <folder>
#   npcc-application evaluate --config configs/application_smoke_triple.toml --out <folder>

base_seed = 317

[data]
dir = "~/npcc-data/meteoswiss_zanetta2023"
verify = true
stations = [0]
lead_hours = 24
init_hour = 0
train = [2017-01-01, 2020-12-31]
test = [2021-01-01, 2021-12-31]
min_cases = 20

[margins]
# The seasonal EMOS baseline, against which the CRPSS is read, and TabPFN on
# all the covariates.
models = ["emos-seasonal", "tabpfn-quantiles-all"]
n_levels = 199
# The copulas' training PITs come from margins fitted without the case's
# initialization year, leave one year out over the four training years. A
# margin evaluated at its own training cases crowds their PITs toward 0.5:
# in the full run at dc09eaf, TabPFN's in-sample training PITs had SD 0.26
# to 0.27 against a uniform 0.289, EMOS's 0.288. The test predictions stay
# those of the margin fitted on every training case.
train_pits = "out_of_fold"

# The measured triple. T, RH and p are measured, stored exactly on a 0.1
# grid; the dew point and the mixing ratio are computed from them
# (npcc.experiments.application.derived), so they are derived from every
# copula draw of (T, RH, p) and scored with it, but no margin or copula is
# fitted to them and their scales below are unused. RH keeps FLBuchner's
# logit transform, 100 -> 99.95 boundary nudge and beta EMOS.
[responses]
modeled = ["obs:air_temperature", "obs:relative_humidity", "obs:surface_air_pressure"]
derived = ["obs:dew_point_temperature", "obs:water_vapor_mixing_ratio"]
# MeteoSwiss's piecewise Magnus formula, as Zanetta et al. (2023) use.
magnus = "meteoswiss"
"obs:air_temperature" = { transform = "identity" }
"obs:dew_point_temperature" = { transform = "identity" }
"obs:relative_humidity" = { transform = "logit", scale = 100.0, boundary_nudge = 0.05 }
"obs:surface_air_pressure" = { transform = "identity" }
"obs:water_vapor_mixing_ratio" = { transform = "log" }

[copulas]
margins = ["emos-seasonal", "tabpfn-quantiles-all"]
arms = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "boostcopula-time",
  "npcc-random-tabpfn-quantiles-all",
  "npcc-random-tabpfn-quantiles-time",
  "npcc-mixture-tabpfn-quantiles-all",
  "npcc-mixture-tabpfn-quantiles-time",
]
n_draws = 200
sample_batch_size = 5000
mixture_k = 5
# Every scored result's draws of all five responses, per test case, are
# stored beside its scores as draws.parquet (float32, zstd): 363 test cases
# x 200 draws x 5 responses x 4 bytes, about 1.45 MB per sampled result and
# station before compression.
save_draws = true

# `--device` overrides every entry. A backend left out picks its own: CUDA
# where there is one.
[devices]
lightgbm = "cpu"
tabpfn-quantiles = "cuda"
tabicl = "cuda"

# E1's entries, copied verbatim from configs/study.toml, so a label means the
# same backend configuration in both; tests/experiments/
# test_application_config.py pins their estimator_id to E1's. A margin uses
# an entry's backend and backend_kwargs on its response's transform; a copula
# uses the entry whole.

[[estimators]]
label = "tabpfn-quantiles-v3-probit"
backend = "tabpfn-quantiles"
transform = "probit"
backend_kwargs = { model_version = "v3", model_kwargs = { softmax_temperature = 1.0 } }

[[estimators]]
label = "tabicl-probit"
backend = "tabicl"
transform = "probit"

[[estimators]]
label = "lightgbm-probit"
backend = "lightgbm"
transform = "probit"
