# The full grid's station-0 smoke (configs/application_full.toml), to
# measure each arm's time on the run's machine before launch. The full grid: the
# consolidated design (configs/application_consolidated.toml) with every
# copula on every margin in both designs, as FLBuchner's npcc-paper PR #6
# runs them, and his 500 draws per case, all stored.
#
# - Margins: seven models, each fitted once to all five responses, with
#   out-of-fold training PITs (leave one training year out) for the copulas,
#   and their test quantiles stored as float32. EMOS's are also scored by
#   their closed-form CRPS, a check of the quantile CRPS that no skill reads.
# - The main design, the triple (d = 3): copulas on (T, RH, p), the dew point
#   and the mixing ratio derived from every draw, so every draw is physically
#   possible by construction. Its log score is joint_nll_modeled.
# - The 5d design (arms named <arm>@5d): copulas on all five responses at
#   once. Two of the five are functions of the other three in the data, so
#   their joint distribution has no density: the 5d log score (joint_nll_5d)
#   is stored but neither summarized nor ranked. independence@5d and
#   gaussian@5d also score the exact log density of (T, RH, p) under their
#   own model, in joint_nll_modeled, which does compare with the triple's.
# - Every arm is also scored on the responses both designs share with the
#   triple's modeled ones, (T, RH, p): energy_trhp and variogram_trhp.
#
#   npcc-application margins  --config configs/application_full.toml --out <run>
#   npcc-application copulas  --config configs/application_full.toml --out <run>
#   npcc-application evaluate --config configs/application_full.toml --out <run>
#   python scripts/paper/application/paired_summary.py --run <run>
#   (scripts/paper/application/launch_full.sh runs them in priority order)
#
# The summaries, fixed before the run (paired_summary.py, every score
# lower-is-better, paired by station, on every station and without station
# 106, with block-bootstrap intervals over shared test dates):
#   (i)   every arm's pooled mean of every score;
#   (ii)  every arm against gaussian on the same margins and design
#         (gaussian@5d for a 5d arm), and every arm against the anchor,
#         npcc-mixture-tabpfn-quantiles-all on tabpfn-quantiles-all;
#   (iii) every 5d arm against the same arm of the triple on the same margins,
#         on energy and variogram over all five responses and over
#         (T, RH, p), the CRPS of each response (Td and w derived against
#         direct), the share of draws breaking each physical bound (Td > T,
#         RH outside [0, 100], w < 0, p <= e), and, for independence and
#         gaussian, the projected log score of (T, RH, p).
# The three chain backends get no pairwise rule of their own: each is an
# arm against gaussian and the anchor.

base_seed = 317

[data]
dir = "~/npcc-data/meteoswiss_zanetta2023"
verify = true
stations = [0]
lead_hours = 24
init_hour = 0
train = [2017-01-01, 2020-12-31]
test = [2021-01-01, 2021-12-31]
min_cases = 20

[margins]
# Seasonal EMOS, against which the CRPSS is read, and each npcc backend on
# all the covariates or on seasonal EMOS's (the target's ensemble mean and
# the day of year), as PR #6 and configs/application.toml have them.
models = [
  "emos-seasonal",
  "lightgbm-all",
  "lightgbm-emos",
  "tabpfn-quantiles-all",
  "tabpfn-quantiles-emos",
  "tabicl-all",
  "tabicl-emos",
]
n_levels = 199
# The copulas' training PITs come from margins fitted without the case's
# initialization year, leave one year out over the four training years. A
# margin evaluated at its own training cases crowds their PITs toward 0.5:
# in the triple's full run (dc09eaf), TabPFN's in-sample training PITs had
# SD 0.26 to 0.27 against a uniform 0.289. The test predictions stay those of
# the margin fitted on every training case; evaluate's
# tables/margins_pit_uniformity.csv compares both kinds of training PIT.
train_pits = "out_of_fold"
# Rounded to float32 as soon as they are predicted, then scored and stored:
# 7 significant digits, ample for data on a 0.1 grid, and half the disk. The
# copula stage reads the stored values, so a rerun from the files reproduces
# every score.
quantile_dtype = "float32"

# The main design: the measured triple. T, RH and p are measured, stored
# exactly on a 0.1 grid; the dew point and the mixing ratio are computed from
# them (npcc.experiments.application.derived), so the triple's arms derive
# them from every draw. The 5d design below also fits a copula to them, so
# their margins are fitted too. RH keeps FLBuchner's logit transform,
# 100 -> 99.95 boundary nudge and beta EMOS.
[responses]
modeled = ["obs:air_temperature", "obs:relative_humidity", "obs:surface_air_pressure"]
derived = ["obs:dew_point_temperature", "obs:water_vapor_mixing_ratio"]
# MeteoSwiss's piecewise Magnus formula, as Zanetta et al. (2023) use it, the
# coefficient set chosen by the air temperature's sign for both vapor
# pressures, which reproduces the stored dew point to float32 precision.
magnus = "meteoswiss"
"obs:air_temperature" = { transform = "identity" }
"obs:dew_point_temperature" = { transform = "identity" }
"obs:relative_humidity" = { transform = "logit", scale = 100.0, boundary_nudge = 0.05 }
"obs:surface_air_pressure" = { transform = "identity" }
"obs:water_vapor_mixing_ratio" = { transform = "log" }

# The arms, on every margin and in both designs: independence, gaussian,
# boostcopula-all, and the chain rule with TabPFN, TabICL and LightGBM inside
# on all covariates. On tabpfn-quantiles-all, the main table, also
# boostcopula-time, the npcc mixtures on all covariates and on the day of
# year (every structure at d = 3, each member also scored), and the chain on
# the day of year. 88 arms per station.
#
# The npcc copulas run on the EMOS margins too, as in PR #6. Fitted to PITs
# that are not uniform given the covariates, as EMOS's are, a
# covariate-dependent copula partly recalibrates the margins, and which
# response keeps its margin then depends on the order it is drawn in
# (section 4), so their numbers there read with that caveat.
#
# An arm and its 5d counterpart share their seeds, so their comparison sees
# the same random numbers.
[copulas]
arms = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "boostcopula-time",
  "npcc-mixture-tabpfn-quantiles-all",
  "npcc-mixture-tabpfn-quantiles-time",
  "npcc-chain-tabpfn-quantiles-all",
  "npcc-chain-tabpfn-quantiles-time",
  "npcc-chain-tabicl-all",
  "npcc-chain-lightgbm-all",
  "independence@5d",
  "gaussian@5d",
  "boostcopula-all@5d",
  "npcc-chain-tabpfn-quantiles-all@5d",
  "npcc-chain-tabicl-all@5d",
  "npcc-chain-lightgbm-all@5d",
]
# 500 draws per test case, as PR #6.
n_draws = 500
# 20000 rows per sampling call, as in the triple's full run.
sample_batch_size = 20000
# A mixture's members, at most the 3 structures there are at d = 3; and the
# chain's number of distinct variable orders, 5 of 3! = 6 at d = 3 and of
# 5! = 120 at d = 5.
mixture_k = 5
# Every arm's 500 draws of all five responses, per test case, are stored
# beside its scores as draws.parquet (float32, zstd): 4.9 MB per arm and
# station, measured at station 0, so about 56 GB over 131 stations. A
# mixture's members are scored on their own draws, which are not stored.
save_draws = true
subsets = { trhp = ["obs:air_temperature", "obs:relative_humidity", "obs:surface_air_pressure"] }
projected_log_score = true

[copulas.arms_by_margin]
"emos-seasonal" = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "npcc-chain-tabpfn-quantiles-all",
  "npcc-chain-tabicl-all",
  "npcc-chain-lightgbm-all",
  "independence@5d",
  "gaussian@5d",
  "boostcopula-all@5d",
  "npcc-chain-tabpfn-quantiles-all@5d",
  "npcc-chain-tabicl-all@5d",
  "npcc-chain-lightgbm-all@5d",
]
"lightgbm-all" = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "npcc-chain-tabpfn-quantiles-all",
  "npcc-chain-tabicl-all",
  "npcc-chain-lightgbm-all",
  "independence@5d",
  "gaussian@5d",
  "boostcopula-all@5d",
  "npcc-chain-tabpfn-quantiles-all@5d",
  "npcc-chain-tabicl-all@5d",
  "npcc-chain-lightgbm-all@5d",
]
"lightgbm-emos" = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "npcc-chain-tabpfn-quantiles-all",
  "npcc-chain-tabicl-all",
  "npcc-chain-lightgbm-all",
  "independence@5d",
  "gaussian@5d",
  "boostcopula-all@5d",
  "npcc-chain-tabpfn-quantiles-all@5d",
  "npcc-chain-tabicl-all@5d",
  "npcc-chain-lightgbm-all@5d",
]
"tabpfn-quantiles-all" = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "boostcopula-time",
  "npcc-mixture-tabpfn-quantiles-all",
  "npcc-mixture-tabpfn-quantiles-time",
  "npcc-chain-tabpfn-quantiles-all",
  "npcc-chain-tabpfn-quantiles-time",
  "npcc-chain-tabicl-all",
  "npcc-chain-lightgbm-all",
  "independence@5d",
  "gaussian@5d",
  "boostcopula-all@5d",
  "npcc-chain-tabpfn-quantiles-all@5d",
  "npcc-chain-tabicl-all@5d",
  "npcc-chain-lightgbm-all@5d",
]
"tabpfn-quantiles-emos" = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "npcc-chain-tabpfn-quantiles-all",
  "npcc-chain-tabicl-all",
  "npcc-chain-lightgbm-all",
  "independence@5d",
  "gaussian@5d",
  "boostcopula-all@5d",
  "npcc-chain-tabpfn-quantiles-all@5d",
  "npcc-chain-tabicl-all@5d",
  "npcc-chain-lightgbm-all@5d",
]
"tabicl-all" = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "npcc-chain-tabpfn-quantiles-all",
  "npcc-chain-tabicl-all",
  "npcc-chain-lightgbm-all",
  "independence@5d",
  "gaussian@5d",
  "boostcopula-all@5d",
  "npcc-chain-tabpfn-quantiles-all@5d",
  "npcc-chain-tabicl-all@5d",
  "npcc-chain-lightgbm-all@5d",
]
"tabicl-emos" = [
  "independence",
  "gaussian",
  "boostcopula-all",
  "npcc-chain-tabpfn-quantiles-all",
  "npcc-chain-tabicl-all",
  "npcc-chain-lightgbm-all",
  "independence@5d",
  "gaussian@5d",
  "boostcopula-all@5d",
  "npcc-chain-tabpfn-quantiles-all@5d",
  "npcc-chain-tabicl-all@5d",
  "npcc-chain-lightgbm-all@5d",
]

# The 5d design: every response modeled, none derived.
[copulas.designs.5d]
modeled = [
  "obs:air_temperature",
  "obs:dew_point_temperature",
  "obs:relative_humidity",
  "obs:surface_air_pressure",
  "obs:water_vapor_mixing_ratio",
]
derived = []

# `--device` overrides every entry. A backend left out picks its own: CUDA
# where there is one.
[devices]
lightgbm = "cpu"
tabpfn-quantiles = "cuda"
tabicl = "cuda"

# E1's entries, copied verbatim from configs/study.toml, so a label means the
# same backend configuration in both; tests/experiments/
# test_application_config.py pins their estimator_id to E1's. A margin uses
# an entry's backend and backend_kwargs on its response's transform; a copula
# uses the entry whole.

[[estimators]]
label = "tabpfn-quantiles-v3-probit"
backend = "tabpfn-quantiles"
transform = "probit"
backend_kwargs = { model_version = "v3", model_kwargs = { softmax_temperature = 1.0 } }

[[estimators]]
label = "tabicl-probit"
backend = "tabicl"
transform = "probit"

[[estimators]]
label = "lightgbm-probit"
backend = "lightgbm"
transform = "probit"
