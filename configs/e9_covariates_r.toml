# E9's R competitors (scripts/paper/README.md, E9), on configs/e9_covariates.toml's
# [grid], so they fit exactly its cells' data and are scored at its points and
# draws. Each script is handed all fifteen covariates and the cell's scenario
# and family.
#
# Run with npcc-covstudy --device cpu, single-threaded shards as E1b.

[grid]
families = ["clayton", "gaussian"]
scenarios = ["gampcc", "interaction", "constant"]
n = [500, 2000]
n_rep = 10
n_points = 20
uv_grid_n = 20
holdout_n = 2000

# gamCopula as Vatter and Nagler run it: gamBiCopSelect with the b and z as
# linear and the t as smooth covariates, selected by significance.
[[grid.estimators]]
label = "gamcopula-select"
backend = "gamCopula"
transform = "identity"
kind = "external_r"
script = "r_methods/fit_gamcopula_select.R"

# The oracle: gamCopula with the cell's true family and the scenario's true
# formula.
[[grid.estimators]]
label = "gamcopula-oracle"
backend = "gamCopula"
transform = "identity"
kind = "external_r"
script = "r_methods/fit_gamcopula_oracle.R"

# boostCopula: the b and z as linear columns, a cubic B-spline basis per t,
# stopped by 10-fold cross-validation.
[[grid.estimators]]
label = "boostcopula-smooth-cv"
backend = "boostCopula"
transform = "identity"
kind = "external_r"
script = "r_methods/fit_boostcopula_smooth_cv_covariates.R"
